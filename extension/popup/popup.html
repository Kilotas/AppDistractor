<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>FocusVoid</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Переключатель языка (глобальный) -->
  <div style="position:fixed;top:10px;right:10px;z-index:999">
    <button id="btn-lang" style="
      background:transparent;border:1px solid #2a3d5e;border-radius:6px;
      color:#8892a4;font-size:11px;font-weight:700;padding:3px 8px;cursor:pointer;
    ">EN</button>
  </div>

  <!-- Экран: авторизация -->
  <div id="screen-auth" class="screen hidden">
    <h2 class="app-title">FocusVoid</h2>

    <div id="auth-tabs" class="auth-tabs">
      <button class="auth-tab active" data-tab="login" data-i18n="tabLogin"></button>
      <button class="auth-tab" data-tab="register" data-i18n="tabRegister"></button>
    </div>

    <input id="auth-email" type="email" class="input" placeholder="Email" />
    <input id="auth-password" type="password" class="input" data-i18n-placeholder="placeholderPassword" />
    <input id="auth-confirm" type="password" class="input hidden" data-i18n-placeholder="placeholderConfirm" />
    <p id="auth-hint" class="auth-hint hidden" data-i18n="authHint"></p>

    <button id="btn-auth-submit" class="btn btn-primary" data-i18n="btnLogin"></button>
    <div id="auth-error" class="error hidden"></div>
  </div>

  <!-- Экран: нет активной сессии -->
  <div id="screen-idle" class="screen hidden">
    <h2 class="app-title">FocusVoid</h2>

    <div class="section-label" data-i18n="chooseTask"></div>
    <select id="task-select">
      <option value="" data-i18n="loading"></option>
    </select>

    <div class="pomo-row">
      <label class="pomo-switch">
        <input type="checkbox" id="pomo-check">
        <span class="pomo-knob"></span>
      </label>
      <div class="pomo-info">
        <div class="pomo-label" data-i18n="pomoLabel"></div>
        <div class="pomo-hint" id="pomo-hint"></div>
      </div>
    </div>

    <div class="pomo-settings hidden" id="pomo-settings">
      <div class="pomo-setting">
        <span class="pomo-setting-label" data-i18n="labelFocus"></span>
        <div class="pomo-setting-input">
          <input type="number" id="pomo-focus" min="1" max="120" value="25">
          <span data-i18n="labelMin"></span>
        </div>
      </div>
      <div class="pomo-setting">
        <span class="pomo-setting-label" data-i18n="labelBreak"></span>
        <div class="pomo-setting-input">
          <input type="number" id="pomo-break" min="1" max="60" value="5">
          <span data-i18n="labelMin"></span>
        </div>
      </div>
      <div class="pomo-setting">
        <span class="pomo-setting-label" data-i18n="labelLong"></span>
        <div class="pomo-setting-input">
          <input type="number" id="pomo-long" min="1" max="120" value="15">
          <span data-i18n="labelMin"></span>
        </div>
      </div>
    </div>

    <div class="pomo-row" style="margin-top: 0">
      <label class="pomo-switch">
        <input type="checkbox" id="sounds-check" checked>
        <span class="pomo-knob"></span>
      </label>
      <div class="pomo-info">
        <div class="pomo-label" data-i18n="soundsLabel"></div>
        <div class="pomo-hint" data-i18n="soundsHint"></div>
      </div>
    </div>

    <button id="btn-start" class="btn btn-primary" disabled data-i18n="btnStart"></button>
    <div id="idle-error" class="error hidden"></div>

    <div class="bottom-row">
      <a class="manage-link" href="http://localhost:5173/tasks" target="_blank" data-i18n="manageTasks"></a>
      <button id="btn-logout" class="btn-link" data-i18n="btnLogout"></button>
    </div>
  </div>

  <!-- Экран: сессия активна -->
  <div id="screen-active" class="screen hidden">

    <div class="active-header">
      <div class="phase-badge" id="phase-badge"></div>
      <div class="task-name" id="active-task-name"></div>
    </div>

    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 120 120">
        <defs>
          <linearGradient id="ring-grad" gradientUnits="userSpaceOnUse"
                          x1="60" y1="10" x2="110" y2="110">
            <stop offset="0%" stop-color="#a855f7"/>
            <stop offset="100%" stop-color="#7c3aed"/>
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="60" cy="60" r="50"/>
        <circle class="ring-fill" id="ring-fill" cx="60" cy="60" r="50"
                transform="rotate(-90 60 60)"/>
      </svg>
      <div class="ring-center">
        <div class="timer" id="timer">00:00</div>
        <div class="pomo-dots hidden" id="pomo-dots">○ ○ ○ ○</div>
      </div>
    </div>

    <div class="active-stats">
      <div class="stat">
        <span class="stat-value red" id="blocked-count">0</span>
        <span class="stat-label" data-i18n="labelBlocks"></span>
      </div>
      <div class="stat hidden" id="stat-pomo">
        <span class="stat-value purple" id="pomo-done">0</span>
        <span class="stat-label" data-i18n="labelPomos"></span>
      </div>
    </div>

    <button id="btn-stop" class="btn btn-danger" data-i18n="btnStop"></button>
    <div id="active-error" class="error hidden">
      <div style="margin-top:6px">
        <button id="btn-force-stop" class="btn-link" style="color:#f87171;font-size:11px" data-i18n="btnForceStop"></button>
      </div>
    </div>
  </div>

  <!-- Экран: результат после завершения -->
  <div id="screen-result" class="screen hidden">
    <div class="result-title" data-i18n="resultTitle"></div>

    <div class="score-wrap">
      <span class="score-value" id="result-score">—</span>
      <span class="score-label">focus score</span>
    </div>

    <div class="result-stats">
      <div><span data-i18n="resultDuration"></span> <strong id="result-duration">—</strong></div>
      <div><span data-i18n="resultBlocked"></span> <strong id="result-blocked">—</strong></div>
      <div class="hidden" id="result-pomo-row"><span data-i18n="resultPomos"></span> <strong id="result-pomos">—</strong> 🍅</div>
    </div>

    <button id="btn-new" class="btn btn-primary" data-i18n="btnNewSession"></button>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
