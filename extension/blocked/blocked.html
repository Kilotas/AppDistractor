<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Заблокировано — Focus App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1a1a1a;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .icon {
      font-size: 56px;
      margin-bottom: 24px;
      line-height: 1;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #111827;
    }

    .subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .blocked-url {
      font-size: 13px;
      color: #dc2626;
      background: #fef2f2;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 28px;
      word-break: break-all;
    }

    .timer-row {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 32px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #2563eb;
    }

    .stat-label {
      font-size: 11px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-back {
      display: inline-block;
      padding: 10px 24px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-back:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>

    <h1>Стоп. Ты в фокусе.</h1>

    <p class="subtitle">
      Этот сайт заблокирован во время рабочей сессии.<br>
      Вернись к задаче — ты почти у цели.
    </p>

    <div class="blocked-url" id="blocked-url">—</div>

    <div class="timer-row">
      <div class="stat">
        <span class="stat-value" id="session-timer">—</span>
        <span class="stat-label">в сессии</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="blocked-count">—</span>
        <span class="stat-label">блокировок</span>
      </div>
    </div>

    <button class="btn-back" onclick="history.back()">← Назад</button>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
